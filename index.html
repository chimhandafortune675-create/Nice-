
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RallyXmon</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0f;color:#fff;font-family:Arial,sans-serif}
button,input{font:inherit}
button{cursor:pointer;border:0;border-radius:9px;padding:12px;background:#2196f3;color:white;font-weight:bold}
input{width:100%;padding:13px;margin:7px 0;background:#191922;color:white;border:1px solid #333;border-radius:9px}
header{padding:16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #24242d;position:sticky;top:0;background:#0b0b0f;z-index:2}
.logo{font-size:23px;font-weight:bold;color:#2196f3}
main{max-width:650px;margin:auto;padding:16px}
.panel,.post{background:#14141c;border:1px solid #282833;border-radius:14px;padding:16px;margin-bottom:16px}
h2{font-size:21px}
.muted{color:#aaa;font-size:13px}
.full{width:100%;margin-top:8px}
.secondary{background:#292936}
video{display:block;width:100%;max-height:65vh;object-fit:contain;background:#000;border-radius:10px;margin-top:12px}
.post-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.post-head button{padding:8px;background:#30232a;color:#ff9b9b}
nav{position:sticky;bottom:0;background:#101018;border-top:1px solid #292936;display:flex;justify-content:space-around;padding:12px}
nav button{background:transparent;color:#ccc;padding:9px}
nav button.active{color:#2196f3}
#feed{padding-bottom:24px}
#message{font-size:13px;color:#90caf9;margin:10px 0;overflow-wrap:anywhere}
.hidden{display:none!important}
</style>
</head>
<body>

<header>
  <div class="logo">RallyXmon</div>
  <button id="logout" class="secondary hidden">Sign out</button>
</header>

<main>
  <section id="welcome">
    <div class="panel">
      <h2>Welcome to RallyXmon 💙</h2>
      <p class="muted">Discover videos. Share your creativity. Grow together.</p>
    </div>
    <div class="panel">
      <h2 id="authTitle">Sign in</h2>
      <input id="email" type="email" placeholder="Email address" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="emailBtn" class="full">Sign in</button>
      <button id="googleBtn" class="full">Continue with Google</button>
      <button id="switchBtn" class="full secondary">Create an account</button>
      <p id="message"></p>
    </div>
  </section>

  <section id="app" class="hidden">
    <div class="panel">
      <h2>🎬 Your video community</h2>
      <p class="muted">Welcome, <span id="username"></span></p>
      <button class="full" id="showCreate">＋ Create a post</button>
    </div>

    <section id="create" class="panel hidden">
      <h2>Publish a video</h2>
      <input id="caption" maxlength="300" placeholder="Write a caption...">
      <input id="videoFile" type="file" accept="video/*">
      <p class="muted">Choose a video from your phone. Large uploads use mobile data.</p>
      <button id="uploadBtn" class="full">Publish video</button>
      <p id="uploadMessage" class="muted"></p>
    </section>

    <div id="feed"></div>
  </section>
</main>

<nav id="bottomNav" class="hidden">
  <button class="active" id="homeBtn">⌂ Home</button>
  <button id="discoverBtn">◎ Discover</button>
  <button id="createNav">＋ Create</button>
</nav>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js";

import {
  getAuth, GoogleAuthProvider, signInWithRedirect,
  getRedirectResult, onAuthStateChanged,
  createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js";

import {
  getFirestore, collection, addDoc, deleteDoc, doc,
  query, orderBy, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js";

import {
  getStorage, ref, uploadBytesResumable,
  getDownloadURL, deleteObject
} from "https://www.gstatic.com/firebasejs/12.4.0/firebase-storage.js";

const firebaseConfig = {
  apiKey: "AIzaSyAfEauorhanldytrbCMchmwUf7PMv4_TnA",
  authDomain: "rallyxmon-58dfd.firebaseapp.com",
  projectId: "rallyxmon-58dfd",
  storageBucket: "rallyxmon-58dfd.firebasestorage.app",
  messagingSenderId: "408218925377",
  appId: "1:408218925377:web:6a4dbda25446412aaf89c0",
  measurementId: "G-TGGVZVG4HP"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const storage = getStorage(app);
const google = new GoogleAuthProvider();

const $ = id => document.getElementById(id);
let createMode = false;
let feedUnsubscribe = null;
let signupMode = false;
let showingDiscover = false;

function message(text) {
  $("message").textContent = text;
}

function showCreate(show) {
  $("create").classList.toggle("hidden", !show);
  if (show) $("caption").focus();
}

$("switchBtn").onclick = () => {
  signupMode = !signupMode;
  $("authTitle").textContent = signupMode ? "Create your account" : "Sign in";
  $("emailBtn").textContent = signupMode ? "Create account" : "Sign in";
  $("switchBtn").textContent = signupMode ? "Back to sign in" : "Create an account";
  $("password").autocomplete = signupMode ? "new-password" : "current-password";
  message("");
};

$("emailBtn").onclick = async () => {
  const email = $("email").value.trim();
  const password = $("password").value;
  if (!email || !password) {
    message("Enter your email and password.");
    return;
  }
  $("emailBtn").disabled = true;
  message("Please wait...");
  try {
    if (signupMode) {
      await createUserWithEmailAndPassword(auth, email, password);
    } else {
      await signInWithEmailAndPassword(auth, email, password);
    }
  } catch (e) {
    message(e.code + ": " + e.message);
  } finally {
    $("emailBtn").disabled = false;
  }
};

$("googleBtn").onclick = async () => {
  try {
    message("Opening Google sign-in...");
    await signInWithRedirect(auth, google);
  } catch (e) {
    message(e.code + ": " + e.message);
  }
};

try {
  await getRedirectResult(auth);
} catch (e) {
  message(e.code + ": " + e.message);
}

$("logout").onclick = () => signOut(auth);

onAuthStateChanged(auth, user => {
  const loggedIn = !!user;
  $("welcome").classList.toggle("hidden", loggedIn);
  $("app").classList.toggle("hidden", !loggedIn);
  $("logout").classList.toggle("hidden", !loggedIn);
  $("bottomNav").classList.toggle("hidden", !loggedIn);

  if (user) {
    $("username").textContent = user.displayName || user.email || "Creator";
    startFeed();
  } else {
    if (feedUnsubscribe) feedUnsubscribe();
    feedUnsubscribe = null;
    $("feed").replaceChildren();
    showCreate(false);
  }
});

$("showCreate").onclick = () => showCreate(true);
$("createNav").onclick = () => showCreate(true);
$("homeBtn").onclick = () => {
  showingDiscover = false;
  $("homeBtn").classList.add("active");
  $("discoverBtn").classList.remove("active");
  $("feed").scrollIntoView({behavior:"smooth"});
};
$("discoverBtn").onclick = () => {
  showingDiscover = true;
  $("discoverBtn").classList.add("active");
  $("homeBtn").classList.remove("active");
  $("feed").scrollIntoView({behavior:"smooth"});
};

function startFeed() {
  if (feedUnsubscribe) feedUnsubscribe();

  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"));

  feedUnsubscribe = onSnapshot(q, snapshot => {
    const feed = $("feed");
    feed.replaceChildren();

    if (snapshot.empty) {
      const empty = document.createElement("div");
      empty.className = "panel";
      empty.textContent = "No videos yet. Be the first to publish!";
      feed.append(empty);
      return;
    }

    snapshot.forEach(item => {
      const post = item.data();
      const card = document.createElement("article");
      card.className = "post";

      const head = document.createElement("div");
      head.className = "post-head";
      const creator = document.createElement("strong");
      creator.textContent = post.creatorName || "RallyXmon creator";
      head.append(creator);

      if (auth.currentUser && post.uid === auth.currentUser.uid) {
        const del = document.createElement("button");
        del.textContent = "Delete";
        del.onclick = async () => {
          if (!confirm("Delete your post?")) return;
          del.disabled = true;
          try {
            await deleteDoc(doc(db, "posts", item.id));
            if (post.storagePath) {
              try {
                await deleteObject(ref(storage, post.storagePath));
              } catch (e) {
                console.warn("Storage cleanup:", e);
              }
            }
          } catch (e) {
            alert("Could not delete: " + e.message);
            del.disabled = false;
          }
        };
        head.append(del);
      }

      const caption = document.createElement("p");
      caption.textContent = post.caption || "";

      card.append(head, caption);

      if (post.videoUrl) {
        const video = document.createElement("video");
        video.src = post.videoUrl;
        video.controls = true;
        video.playsInline = true;
        video.preload = "metadata";
        card.append(video);
      }

      const info = document.createElement("p");
      info.className = "muted";
      info.textContent = "RallyXmon • Video post";
      card.append(info);
      feed.append(card);
    });
  }, error => {
    $("feed").textContent =
      "Feed error: " + error.message +
      " — Check your Firestore database and security rules.";
  });
}

$("uploadBtn").onclick = async () => {
  const user = auth.currentUser;
  const file = $("videoFile").files[0];
  const caption = $("caption").value.trim();

  if (!user) return alert("Please sign in first.");
  if (!file) return alert("Choose a video first.");
  if (!file.type.startsWith("video/")) {
    return alert("Please select a video file.");
  }

  const btn = $("uploadBtn");
  const status = $("uploadMessage");
  btn.disabled = true;

  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = `videos/${user.uid}/${Date.now()}_${safeName}`;
    const storageRef = ref(storage, path);
    const task = uploadBytesResumable(storageRef, file);

    const url = await new Promise((resolve, reject) => {
      task.on("state_changed",
        snap => {
          const percent = Math.round(
            snap.bytesTransferred / snap.totalBytes * 100
          );
          status.textContent = `Uploading: ${percent}%`;
        },
        reject,
        async () => {
          try {
            resolve(await getDownloadURL(task.snapshot.ref));
          } catch (e) {
            reject(e);
          }
        }
      );
    });

    await addDoc(collection(db, "posts"), {
      uid: user.uid,
      creatorName: user.displayName || user.email || "Creator",
      caption,
      videoUrl: url,
      storagePath: path,
      createdAt: serverTimestamp()
    });

    $("caption").value = "";
    $("videoFile").value = "";
    status.textContent = "Video published successfully!";
    showCreate(false);
  } catch (e) {
    status.textContent = e.code
      ? e.code + ": " + e.message
      : e.message;
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
    </html>
