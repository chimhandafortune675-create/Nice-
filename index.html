
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RALLY FOOTBALL</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;background:#050810;color:white;
  font-family:Arial,sans-serif;overflow:hidden
}
button{cursor:pointer;font-weight:900;border:0}
#intro{
  position:fixed;inset:0;z-index:5;
  display:flex;flex-direction:column;
  justify-content:space-between;align-items:center;
  padding:30px 18px;
  background:
    radial-gradient(ellipse at 50% 65%,#14612f 0%,transparent 45%),
    linear-gradient(180deg,#050815 0%,#102b40 52%,#07130d 100%);
}
.top{width:100%;display:flex;justify-content:space-between;
align-items:center;max-width:600px}
.logo{font-size:22px;font-weight:1000;letter-spacing:2px}
.logo span{color:#35e5ff}
.pill{border:1px solid #ffffff40;padding:8px 12px;
border-radius:20px;font-size:10px;letter-spacing:2px}
.hero{text-align:center;width:100%;max-width:600px}
.eyebrow{color:#48edff;letter-spacing:5px;font-size:11px;
font-weight:bold}
h1{font-size:clamp(48px,13vw,86px);line-height:.9;
font-style:italic;letter-spacing:-4px;margin:17px 0}
h1 span{color:#4ceaff;text-shadow:0 0 30px #00aaff70}
.subtitle{color:#c4d3e2;letter-spacing:2px;font-size:12px}
.trophy{
  font-size:clamp(85px,25vw,145px);
  margin:20px 0 5px;
  filter:drop-shadow(0 0 28px #f6b73375);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{
  50%{transform:translateY(-9px) scale(1.04)}
}
.cta{
  width:min(100%,360px);padding:19px;
  border-radius:8px;color:#00131a;font-size:16px;
  background:linear-gradient(100deg,#38eaff,#6bffb1);
  box-shadow:0 0 30px #31ddff45;
}
.note{font-size:10px;color:#8293a7;letter-spacing:2px;
margin-top:15px}
.bottom{font-size:10px;letter-spacing:3px;color:#8da0b2}
#game{display:none;position:fixed;inset:0;background:#07120b}
#game canvas{display:block;width:100%;height:100%}
.hud{position:absolute;inset:0;pointer-events:none;padding:16px}
.hud button{pointer-events:auto}
.gamebrand{font-weight:1000;font-size:18px;
text-shadow:0 2px 8px #000}
.score{position:absolute;top:15px;left:50%;
transform:translateX(-50%);background:#07151ddd;
border:1px solid #ffffff30;padding:12px 20px;
border-radius:10px;text-align:center;white-space:nowrap}
.score small{display:block;font-size:9px;letter-spacing:2px;
color:#5eeaff;margin-bottom:5px}
#scoreNum{font-size:25px}
.back{background:#111d2cdd;color:white;
padding:11px 14px;border-radius:8px}
.controls{position:absolute;bottom:24px;left:20px;right:20px;
display:flex;justify-content:space-between;align-items:end}
.pad{display:grid;grid-template-columns:repeat(3,48px);
grid-template-rows:repeat(2,48px);gap:5px}
.ctrl,.shoot{background:#0b1928cc;color:white;
border:1px solid #ffffff55;border-radius:12px;
font-size:20px;touch-action:none}
.ctrl{width:48px;height:48px}
.shoot{width:84px;height:84px;border-radius:50%;
background:linear-gradient(145deg,#50f1ff,#1584ff);
color:#001322;box-shadow:0 0 25px #00aaff70;font-size:13px}
#message{position:absolute;top:29%;width:100%;text-align:center;
font-size:12px;letter-spacing:3px;color:#d8faff;
text-shadow:0 2px 8px black;pointer-events:none}
</style>
</head>

<body>
<section id="intro">
  <div class="top">
    <div class="logo">RALLY<span>⚡</span></div>
    <div class="pill">FOOTBALL • 3D</div>
  </div>

  <div class="hero">
    <div class="eyebrow">THE NEXT GENERATION OF FOOTBALL</div>
    <h1>SUPER<br><span>STAR</span></h1>
    <div class="subtitle">YOUR CLUB. YOUR LEGACY.</div>
    <div class="trophy">🏆</div>
    <button class="cta" id="start">GET STARTED &nbsp; ➜</button>
    <div class="note">ENTER THE STADIUM</div>
  </div>

  <div class="bottom">PLAY WITH PASSION · WIN WITH PRIDE</div>
</section>

<section id="game">
  <div class="hud">
    <div class="gamebrand">RALLY<span style="color:#4ceaff">⚡</span></div>
    <button class="back" id="back">← MENU</button>
    <div class="score">
      <small>YOUR MATCH</small>
      <span id="scoreNum">0</span> &nbsp; GOALS
    </div>
    <div id="message">YOUR STADIUM AWAITS</div>

    <div class="controls">
      <div class="pad">
        <span></span>
        <button class="ctrl" data-move="forward">▲</button>
        <span></span>
        <button class="ctrl" data-move="left">◀</button>
        <button class="ctrl" data-move="back">▼</button>
        <button class="ctrl" data-move="right">▶</button>
      </div>
      <button class="shoot" id="shoot">SHOOT<br>⚽</button>
    </div>
  </div>
</section>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from "three";

const intro = document.querySelector("#intro");
const game = document.querySelector("#game");
const message = document.querySelector("#message");
const scoreNum = document.querySelector("#scoreNum");

let scene, camera, renderer, player, ball, goal;
let started = false, goals = 0, shotTime = 0;
let ballVelocity = new THREE.Vector3();
const keys = new Set();
const clock = new THREE.Clock();

function material(color, extra={}) {
  return new THREE.MeshStandardMaterial({color,...extra});
}

function box(parent, size, pos, mat) {
  const obj = new THREE.Mesh(
    new THREE.BoxGeometry(...size), mat
  );
  obj.position.set(...pos);
  parent.add(obj);
  return obj;
}

function buildStadium() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color("#83b7df");
  scene.fog = new THREE.Fog("#83b7df", 65, 145);

  camera = new THREE.PerspectiveCamera(
    53, innerWidth/innerHeight, 0.1, 250
  );

  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled = false;
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  game.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight("#e7f6ff","#18381b",2));

  const sun = new THREE.DirectionalLight("#ffffff",2.5);
  sun.position.set(-15,35,12);
  scene.add(sun);

  // Football pitch
  const grass = material("#17813d");
  box(scene,[64,.2,100],[0,-.15,0],grass);

  // Alternating grass stripes
  for(let i=0;i<10;i++){
    box(scene,[64,.02,10],[0,-.035,-45+i*10],
      material(i%2?"#218c43":"#197b39"));
  }

  // Pitch markings
  const white = new THREE.MeshBasicMaterial({color:"#ffffff"});
  function line(x1,z1,x2,z2) {
    const dx=x2-x1, dz=z2-z1;
    const length=Math.hypot(dx,dz);
    const obj=new THREE.Mesh(
      new THREE.BoxGeometry(length,.035,.14),white
    );
    obj.position.set((x1+x2)/2,-.01,(z1+z2)/2);
    obj.rotation.y=-Math.atan2(dz,dx);
    scene.add(obj);
  }

  line(-29,-45,29,-45);
  line(-29,45,29,45);
  line(-29,-45,-29,45);
  line(29,-45,29,45);
  line(-29,0,29,0);

  const circle=new THREE.Mesh(
    new THREE.RingGeometry(9.8,10,.8,100),
    new THREE.MeshBasicMaterial({color:"white",side:THREE.DoubleSide})
  );
  circle.rotation.x=-Math.PI/2;
  circle.position.y=.01;
  scene.add(circle);

  box(scene,[.14,.04,16],[0,.01,-34],white);
  box(scene,[.14,.04,16],[0,.01,34],white);
  box(scene,[16,.04,.14],[0,.01,-42],white);
  box(scene,[16,.04,.14],[0,.01,42],white);

  // Stadium stands
  const standColors=["#14283d","#263c54","#172c43"];
  for(let side of [-1,1]){
    for(let tier=0;tier<3;tier++){
      box(scene,[72,3,8],
        [0,4+tier*3,side*(54+tier*5)],
        material(standColors[tier]));
    }
  }

  // Stadium floodlights
  for(let x of [-31,31]){
    for(let z of [-43,43]){
      box(scene,[.35,20,.35],[x,11,z],
        material("#788da3",{metalness:.5}));
      const light=new THREE.PointLight("#d8f5ff",18,45);
      light.position.set(x,22,z);
      scene.add(light);
      box(scene,[4,.4,.7],[x,21,z],
        material("#e6fbff",{emissive:"#7abfff",emissiveIntensity:2}));
    }
  }

  // Goal at far end
  goal=new THREE.Group();
  goal.position.set(0,0,-44);
  scene.add(goal);

  const postMat=material("#ffffff",{metalness:.2});
  box(goal,[.25,5,.25],[-6,2.5,0],postMat);
  box(goal,[.25,5,.25],[6,2.5,0],postMat);
  box(goal,[12,.25,.25],[0,5,0],postMat);

  const netMat=new THREE.MeshBasicMaterial({
    color:"#d8f2ff",wireframe:true
  });
  const net=new THREE.Mesh(
    new THREE.BoxGeometry(12,5,3),netMat
  );
  net.position.set(0,2.5,-1.4);
  goal.add(net);

  // Simple 3D player
  player=new THREE.Group();
  const shirt=material("#e9f3ff");
  const shorts=material("#142b65");
  const skin=material("#a96c43");
  box(player,[1.15,1.35,.65],[0,2.15,0],shirt);
  box(player,[.65,.65,.65],[0,3.2,0],skin);
  box(player,[.4,.16,.4],[0,3.58,0],
    material("#152e67"));
  box(player,[.4,.95,.42],[-.32,.95,0],shorts);
  box(player,[.4,.95,.42],[.32,.95,0],shorts);
  box(player,[.32,.95,.35],[-.32,.4,.03],
    material("#eaf5ff"));
  box(player,[.32,.95,.35],[.32,.4,.03],
    material("#eaf5ff"));
  scene.add(player);
  player.position.set(0,0,22);

  // Football
  ball=new THREE.Mesh(
    new THREE.SphereGeometry(.48,20,16),
    material("#ffffff")
  );
  ball.position.set(0,.5,19.8);
  scene.add(ball);

  // Skybox-like stadium surroundings
  for(let i=0;i<100;i++){
    const light=new THREE.Mesh(
      new THREE.BoxGeometry(.22,.22,.22),
      new THREE.MeshBasicMaterial({
        color:i%2?"#bdefff":"#ffffff"
      })
    );
    light.position.set(
      (Math.random()-.5)*90,
      5+Math.random()*10,
      (Math.random()-.5)*110
    );
    scene.add(light);
  }

  camera.position.set(0,8,34);
  camera.lookAt(0,1,12);
}

function resetBall(){
  ball.position.set(
    player.position.x, .5, player.position.z-2.2
  );
  ballVelocity.set(0,0,0);
}

function animate(){
  if(!started)return;
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.04);
  const speed=9*dt;

  if(keys.has("left")) player.position.x-=speed;
  if(keys.has("right")) player.position.x+=speed;
  if(keys.has("forward")) player.position.z-=speed;
  if(keys.has("back")) player.position.z+=speed;

  player.position.x=THREE.MathUtils.clamp(
    player.position.x,-27,27
  );
  player.position.z=THREE.MathUtils.clamp(
    player.position.z,-39,43
  );

  // Follow the player
  const target=new THREE.Vector3(
    player.position.x*.5,7,player.position.z+12
  );
  camera.position.lerp(target,.08);
  camera.lookAt(player.position.x,1,player.position.z-10);

  // Ball physics
  ball.position.addScaledVector(ballVelocity,dt);
  ballVelocity.multiplyScalar(Math.pow(.985,dt*60));
  ballVelocity.y-=9.8*dt;

  if(ball.position.y<.48){
    ball.position.y=.48;
    if(ballVelocity.y<0)ballVelocity.y*=-.45;
  }

  // Player and ball collision
  if(ball.position.distanceTo(
    new THREE.Vector3(player.position.x,ball.position.y,
      player.position.z-1.7)
  )<1.3 && ballVelocity.length()<1.5){
    ball.position.x=player.position.x;
    ball.position.z=player.position.z-2;
  }

  // Goal detection
  if(ball.position.z < -43 &&
     Math.abs(ball.position.x)<6 &&
     ball.position.y<5){
    goals++;
    scoreNum.textContent=goals;
    message.textContent="GOAL! SUPER STAR! 🏆";
    resetBall();
    setTimeout(()=>message.textContent="YOUR NEXT GOAL AWAITS",1300);
  }

  if(ball.position.z < -48 ||
     ball.position.z > 48 ||
     Math.abs(ball.position.x)>32){
    resetBall();
  }

  renderer.render(scene,camera);
}

document.querySelector("#start").onclick=()=>{
  intro.style.display="none";
  game.style.display="block";

  if(!started){
    buildStadium();
    started=true;
    animate();
  }
  clock.start();
};

document.querySelector("#back").onclick=()=>{
  game.style.display="none";
  intro.style.display="flex";
};

document.querySelectorAll("[data-move]").forEach(btn=>{
  const move=btn.dataset.move;
  btn.addEventListener("pointerdown",e=>{
    e.preventDefault();
    keys.add(move);
  });
  ["pointerup","pointercancel","pointerleave"].forEach(ev=>{
    btn.addEventListener(ev,()=>keys.delete(move));
  });
});

document.querySelector("#shoot").addEventListener("pointerdown",e=>{
  e.preventDefault();
  ball.position.set(
    player.position.x,.65,player.position.z-2.2
  );
  ballVelocity.set(
    player.position.x*.08,-.4,-25
  );
  message.textContent="TAKE THE SHOT!";
});

addEventListener("pointerup",()=>keys.clear());

addEventListener("resize",()=>{
  if(!camera||!renderer)return;
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
  </html>
